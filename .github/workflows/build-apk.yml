# Builds the nxnative Android app — the APK — for a game profile, without game files (none are in the repository).
# One app carries every game: the APK built here holds the Sonic Frontiers Definitive Edition profile's host
# (libdmhost_0400921025B32000.so, built from dm/games/0400921025B32000 by dm/android's CMake), the loader, the self
# test and the NVN demo's shaders (dm/android/tests/synth_shaders.py, translated by the repository's dmsh_xlate).
# A game's own files — its code, its RomFS and its shaders — are packed and pushed to the phone with
# scripts/build_android_from_nsp.py, not carried in the APK; the host here is what that script's --apk-only packs
# from a computer that has built the game.
# The shaders are packed for the Mali-G57 MC2 (--gpu mali-g57-mc2): spv_android.py adds NonWritable to every
# vertex-pipeline shader's read-only storage resources at pack time (dm/android/spv_readonly.h's pass, which the
# host otherwise applies at shader-module load on a device without vertexPipelineStoresAndAtomics — the Mali-G57
# MC2 has none), and the NDK's spirv-val checks every packed module for vulkan1.1.
name: build-apk

on:
  workflow_dispatch:
    inputs:
      game:
        description: 'the game profile to build the host for (a base game title ID in dm/games)'
        required: false
        default: '0400921025B32000'   # Sonic Frontiers Definitive Edition
      gpu:
        description: "the GPU the shaders are packed for (spv_android.py's --gpu: default, or a Mali target such as mali-g57-mc2)"
        required: false
        default: 'mali-g57-mc2'
  push:
    branches: [main]

permissions:
  contents: write   # the SDK-diagnostic step pushes its log to a branch when the SDK setup fails

# A new commit replaces the older run; the APK of the newest commit is the one that matters.
concurrency:
  group: build-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GAME: ${{ github.event.inputs.game || '0400921025B32000' }}   # Sonic Frontiers Definitive Edition
  GPU: ${{ github.event.inputs.gpu || 'mali-g57-mc2' }}         # the Mali-G57 MC2: NonWritable at pack time
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_NDK: ${{ github.workspace }}/android-sdk/ndk/28.2.13676358
  ANDROID_CMAKE: ${{ github.workspace }}/android-sdk/cmake/3.22.1

defaults:
  run:
    shell: bash

# Actions are pinned to commit SHAs (the tag in the comment): a tag can be moved, a SHA cannot.
jobs:
  build-apk:
    name: Build the APK (${{ github.event.inputs.game || '0400921025B32000' }}, GPU ${{ github.event.inputs.gpu || 'mali-g57-mc2' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: true   # the SDK-diagnostic step pushes its log to a branch on failure

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: '3.12'
      - name: Python packages
        run: python -m pip install lz4 capstone fonttools backports.zstd

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3   # v4
        with:
          distribution: temurin
          java-version: '17'   # keytool and javac (the APK's keystore and classes.dex)

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9   # v4
        with:
          dotnet-version: '10.0.x'   # dmsh_xlate.dll (the shader translator) runs on the .NET 10 runtime

      - name: Android SDK
        run: |
          {
            set -eux
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            # yes gets a broken pipe (SIGPIPE) when sdkmanager exits; ignore that pipeline's status
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platform-tools" "platforms;android-35" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          } 2>&1 | tee /tmp/sdk_setup.log

      - name: Upload SDK setup log (diagnostics)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sdk-setup-log
          path: /tmp/sdk_setup.log
          if-no-files-found: ignore

      # The Mali pass's checks, with the NDK: the port of spv_readonly.h in spv_android.py against the C itself, and
      # the pass over a game's packed shaders (dm/tools/tests/test_spv_readonly.py, test_spv_mali.py).
      - name: Shader pass tests (with the NDK)
        run: |
          set -eo pipefail
          python -m unittest dm.tools.tests.test_spv_mali dm.tools.tests.test_spv_readonly -v 2>&1 | tee /tmp/shader_tests.log

      - name: The game's host (dm/android, CMake + the NDK)
        run: |
          set -eo pipefail
          cmake -G Ninja -S dm/android -B build/host \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DCMAKE_MAKE_PROGRAM="$ANDROID_CMAKE/bin/ninja" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DGAME="$GAME" -DPython3_EXECUTABLE="$(which python3)" 2>&1 | tee /tmp/host_build.log
          ninja -C build/host dmhost_app nxloader 2>&1 | tee -a /tmp/host_build.log

      - name: The self test (a synthetic module, rewritten for Android)
        run: |
          set -eo pipefail
          mkdir -p build/selftest
          ndk_bin="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python dm/android/tests/selftest_nso.py "$ndk_bin/clang" "$ndk_bin/llvm-objcopy" build/selftest/main.nso 2>&1 | tee /tmp/selftest.log
          DM_GAME="$GAME" DM_TARGET=android python dm/tools/patch_nso.py build/selftest/main.nso build/selftest/patched main 2>&1 | tee -a /tmp/selftest.log

      - name: The demo's shaders, packed for the ${{ github.event.inputs.gpu || 'mali-g57-mc2' }}
        run: |
          set -eo pipefail
          python dm/android/tests/synth_shaders.py build/demo 2>&1 | tee /tmp/shaders.log
          python dm/android/tools/spv_build.py build/demo/pkg build/demo/spv \
            --xlate dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate.dll --facts build/demo/facts.tsv --gpu "$GPU" 2>&1 | tee -a /tmp/shaders.log

      - name: Check the packed shaders for vulkan1.1 (the ${{ github.event.inputs.gpu || 'mali-g57-mc2' }}'s rule)
        run: |
          set -eo pipefail
          spirv_val="$ANDROID_NDK/shader-tools/linux-x86_64/spirv-val"
          for f in build/demo/spv/*.spv; do "$spirv_val" --target-env vulkan1.1 "$f"; done 2>&1 | tee /tmp/spirv_check.log
          echo "$(ls build/demo/spv/*.spv | wc -l) shader modules, all valid for vulkan1.1" 2>&1 | tee -a /tmp/spirv_check.log

      - name: Pack the APK
        run: |
          set -eo pipefail
          python dm/android/tools/build_apk.py --sdk "$ANDROID_HOME" \
            --loader build/host/libnxloader.so \
            --so "build/host/libdmhost_${GAME}.so" \
            --selftest build/selftest/patched \
            --demo build/demo/spv \
            --keystore "$RUNNER_TEMP/nxnative-debug.jks" \
            -o nxnative.apk 2>&1 | tee /tmp/apk.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: nxnative-apk-${{ github.event.inputs.game || '0400921025B32000' }}-${{ github.event.inputs.gpu || 'mali-g57-mc2' }}
          path: nxnative.apk
          retention-days: 30

      # Last, on failure: push the SDK/shader-test logs to a branch (their artifact/log hosts are not reachable
      # from every environment, but the repository is), so the real error is readable.
      - name: Push SDK/shader-test diagnostic to a branch (on failure)
        if: failure()
        run: |
          set -eux
          any=0
          for f in sdk_setup shader_tests host_build selftest shaders spirv_check apk; do
            if [ -f "/tmp/${f}.log" ]; then cp "/tmp/${f}.log" "./${f}.log"; any=1; fi
          done
          [ "$any" = "1" ] || exit 0
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -b "sdk-diag/${{ github.run_id }}"
          # git add aborts entirely if any named path is missing, so add the logs one by one
          for f in sdk_setup shader_tests host_build selftest shaders spirv_check apk; do
            [ -f "./${f}.log" ] && git add "${f}.log"
          done
          git commit -m "Build pipeline diagnostic (run ${{ github.run_id }})" || true
          git push origin "sdk-diag/${{ github.run_id }}"
